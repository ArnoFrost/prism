# Prism Distribution Whitelist
# 控制当前 SDK 分发时包含哪些 skills
# 策略与机制分离：修改此文件即可调整分发范围，无需改脚本
# 3.x mini/full profile 已随 prism-4 分支移出当前 schema；可执行终态见 git tag legacy-3x-final。

version: "4.0.0"

profiles:
  prism4:
    description: "P5 乐观 dogfood 分发 — thin facade + 独立 Review / Plan；P4 基线见 tag p4-shadow-baseline"
    skills:
      - prism
      - prism-review
      - prism-plan
    include_shared: false

# 永远排除（dev 工具 + 个人固化版）
always_exclude:
  - prism-maintain                 # [dev] 维护者源码仓工具
  - prism-review-arno              # [personal]
  - cursor-insights                # [dev] 内部分析工具
