# Prism Distribution Whitelist
# 控制当前 SDK 分发时包含哪些 skills
# 策略与机制分离：修改此文件即可调整分发范围，无需改脚本
# 3.x mini/full profile 已随 prism-4 分支移出当前 schema；可执行终态见 git tag legacy-3x-final。

version: "4.0.0"

profiles:
  prism4:
    description: "4.0 canary 分发 — semantic skills only，不携带 3.x workflow 技能面"
    skills:
      - prism-topic
      - prism-brief
      - prism-review
      - prism-clarify
      - prism-compress
    include_shared: false

# 永远排除（dev 工具 + 个人固化版）
always_exclude:
  - prism-dist                     # [dev] 分发工具自身不入包
  - prism-push                     # [dev] 维护者工具
  - prism-pull                     # [dev] 维护者工具
  - prism-review-arno              # [personal]
  - cursor-insights                # [dev] 内部分析工具
