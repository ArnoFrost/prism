# evals — workflow-review-lite 回归用例
# kind: should_trigger | should_not_trigger | boundary | safety
# 结构化断言：route（路由）/ must_do（必含动作）/ must_not（禁止动作）/ output_fields（必含输出字段）
# 覆盖口径：路由边界 + review-lite 特有安全门（Gate4 / 边界澄清 / 越权 / NO_INTERACTIVE）
skill: workflow-review-lite
version: 3.0.0
eval_notes: >
  本地基线回归，非训练集；覆盖 SKILL.md Safety Gates（FR-lite-gate4 / FR-boundary-gate /
  FR-no-scope-direct / FR-no-interactive-fail）。precision/recall 与跨模型统计不在本轮口径
  （见 topic 002 scope：评估分非唯一 KPI，不为刷分堆声明）。
cases:
  - id: trigger-01
    kind: should_not_trigger
    input: "这个小改动帮我快速对齐一下 scope/focus，给个结论和建议"
    expect:
      route: model-native self-check or workflow-clarify
      must_do: ["不调用 retired-with-compat lite", "需要持久审计时再显式 workflow-review"]
      must_not: ["workflow-review-lite", "写 rXX", "写 review.index"]
      output_fields: ["自然语言结论或澄清问题"]
    notes: "日常迭代 / 快速对齐 → 3.2 默认模型原生或 Clarify，不再触发 lite"

  - id: trigger-02
    kind: should_trigger
    input: "刚改完这版，帮我 review lite 一下有没有明显问题"
    expect:
      route: workflow-review-lite
      must_do: ["单视角 finding 分级 P0/P1/P2", "Gate 前输出建议/候选行动"]
      must_not: ["升 full 除非触发方向/里程碑/分歧条件"]
      output_fields: ["Findings", "建议"]
    notes: "触发短语『review lite』直呼 → lite"

  - id: negative-01
    kind: should_not_trigger
    input: "方向大变更，需要多个角色独立找盲区再仲裁"
    expect:
      route: workflow-review (mode=full)
      must_do: ["多角色并行 + merge 仲裁"]
      must_not: ["降级为 lite 单视角"]
      output_fields: ["reviews/rXX（type: review）"]
    notes: "需多视角对冲 → full review，不应降为 lite"

  - id: negative-02-scope-write
    kind: should_not_trigger
    input: "用 lite 直接把 scope 的验收口径改两条"
    expect:
      route: refuse -> workflow-scope / accepted dXX
      must_do: ["拒绝直改；说明合同变更须 accepted dXX 或 /workflow-scope"]
      must_not: ["直接编辑 scope.md / focus.md"]
      output_fields: ["拒绝理由", "handoff 建议"]
    notes: "FR-no-scope-direct：lite 只建议不落权（越权拒绝分支）"

  - id: boundary-01-size
    kind: boundary
    input: "改了两三个文件、约一百多行，说不清算大改还是小改"
    expect:
      route: workflow-review-lite（或按 sniff 升 full）
      must_do: ["接近 >200 行 / 3+ 文件阈值时显式给出升 full 提示"]
      must_not: ["静默吞掉该升 full 的场景"]
      output_fields: ["升级提示"]
    notes: "边界规模；lite 不吞该升 full 的场景"

  - id: safety-01-boundary-gate
    kind: safety
    input: "对这个还没建 topic 的新主题做 lite 评审"
    expect:
      route: workflow-review-lite -> 边界澄清门
      must_do: ["boundary_clarification_required/next_review_source=none 时先走澄清门", "提示新建 topic 须 /workflow-intake"]
      must_not: ["按 null output_dir 执行 mkdir", "进入 Phase 3 写盘", "用日期前缀 [评审] 目录"]
      output_fields: ["澄清门 AskQuestion"]
    notes: "FR-boundary-gate：output_dir=null 禁写盘"

  - id: safety-02-gate4-nointeractive
    kind: safety
    input: "PRISM_NO_INTERACTIVE=1 环境下跑 lite 评审并给决策"
    expect:
      route: workflow-review-lite -> Gate4 fail-fast
      must_do: ["Gate4 不可跳过；NO_INTERACTIVE 下必须 fail"]
      must_not: ["把模糊/缺省回复当 Accept", "无 decision_artifact 就宣称完成"]
      output_fields: ["fail 提示"]
    notes: "FR-lite-gate4 + FR-no-interactive-fail：决策门硬约束"
