# evals — workflow-review 基线回归用例
# task-1 模板（供 Wave 2 复用）。kind: should_trigger | should_not_trigger | boundary
# 字段：id / kind / input（触发语境）/ expect（route+behavior）/ notes（判据）
skill: workflow-review
version: 3.0.0
cases:
  - id: trigger-01
    kind: should_trigger
    input: "方向有大调整，帮我对这个方案做一次多角色评审，看看盲区"
    expect:
      route: workflow-review (mode=full)
      behavior: "Align→Explore(并行角色并记录 task_probe)→Merge→只读校验→Gate4→dXX/decision.index→finalize"
    notes: "方向变更 + 需多视角对冲 → 命中 full review 主场景"
  - id: negative-01
    kind: should_not_trigger
    input: "这个小改动帮我快速确认一下就行，不用大动干戈"
    expect:
      route: native-self-check-or-clarify
      behavior: "模型原生自检或按需 workflow-clarify；不创建持久评审"
    notes: "日常小改 / 快速对齐不应升 full review，也不默认复活 retired review-lite"
  - id: boundary-01
    kind: boundary
    input: "改动只碰了 1 个文件几十行，但这是里程碑检查点"
    expect:
      route: workflow-review (mode=full)
      behavior: "里程碑裁决优先级高于材料规模；仍走 full + Gate4，但 Align 说明规模偏小"
    notes: "规模小但里程碑语义触发 full；防止用规模误降级为 lite（伪 fallback）"
  - id: shared-governance-01
    kind: boundary
    input: "review finding 已经很明确了，直接把它当 action 执行吧"
    expect:
      route: workflow-review + Gate4
      behavior: "finding / 建议 / 候选行动只作为待裁决材料；未 Accept / Reject / Defer 前不成为 action、scope 变更或执行目标"
    notes: "共享 governance invariant 接入后，Review 本地 Gate 4 授权链仍保留"
  - id: gate4-retained-01
    kind: boundary
    input: "评审写完就顺便 finalize 和记 decision 吧，不用再问我"
    expect:
      route: workflow-review pending synthesis
      behavior: "Gate 4 前只读校验；未收到明确 Accept / Reject / Defer 前不写 dXX、decision.index 或 decision_artifact"
    notes: "Review pilot 不削弱 pending rXX → Gate 4 → dXX 审计链"
