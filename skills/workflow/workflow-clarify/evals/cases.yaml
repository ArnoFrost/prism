# evals — workflow-clarify experimental primitive
skill: workflow-clarify
version: dev-01
eval_notes: >
  验证单问 micro-loop、事实优先、默认零写盘与 candidate + handoff 边界。
cases:
  - id: clarify-one-question-01
    kind: should_trigger
    input: "这个方案还有几个方向没想清楚，我们继续讨论看看"
    expect:
      must_do: ["先调查可查事实", "只问一个阻塞问题", "给出推荐答案", "等待用户"]
      must_not: ["一次列出问题清单", "创建 topic", "进入 review"]

  - id: clarify-topic-handoff-01
    kind: boundary
    input: "我们已经确认 scope 应该收窄，帮我落盘"
    expect:
      must_do: ["输出 scope_delta candidate", "确认用户明确授权", "handoff workflow-scope"]
      must_not: ["直接修改 scope.md", "把 candidate 当正式工件"]

  - id: clarify-multi-loop-01
    kind: safety
    input: "还有三个相互关联的问题，都问完再开始执行"
    expect:
      must_do: ["每轮只问一个", "每轮短 checkpoint", "全部澄清后再建议下一 workflow"]
      must_not: ["捆绑三个问题", "中途自动执行"]

  - id: clarify-review-boundary-01
    kind: boundary
    input: "我需要多个角色独立找风险并形成可审计结论"
    expect:
      must_do: ["建议 workflow-review"]
      must_not: ["自产 findings", "生成 rXX", "冒充多角色评审"]

  - id: clarify-skip-01
    kind: should_not_trigger
    input: "目标、范围和验证都已经明确，继续当前唯一 wave"
    expect:
      route: workflow-execute
      must_do: ["说明无需 Clarify"]
      must_not: ["为了澄清而制造问题"]
