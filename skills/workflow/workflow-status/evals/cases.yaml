# evals — workflow-status 基线回归用例
# task-1 模板（供 Wave 2 复用）。kind: should_trigger | should_not_trigger | boundary
skill: workflow-status
version: 3.0.0
cases:
  - id: trigger-01
    kind: should_trigger
    input: "看下当前专项的进度和健康度，骨架有没有缺"
    expect:
      route: workflow-status
      behavior: "report-first 扫描活跃专项，输出结构化健康报告；只读不改"
    notes: "进度/健康/骨架完整性查询 → status 主场景"
  - id: negative-01
    kind: should_not_trigger
    input: "帮我把 scope 的验收口径补两条"
    expect:
      route: workflow-scope
      behavior: "status 只报告不修改；写盘属 scope 职责"
    notes: "写操作不属 status（report-first 边界）"
  - id: boundary-01
    kind: boundary
    input: "扫一下状态，顺手把发现的不规范产物改掉"
    expect:
      route: workflow-status（报告）+ 建议后续 scope/tidy
      behavior: "status 输出发现与建议，但不自行落盘修改；修复交由对应 skill"
    notes: "查中带改：status 守只读，改动 handoff，不越权写盘"
  - id: archive-preview-01
    kind: boundary
    input: "看下哪些 topic 已经都完成了，能归档的也帮我处理一下"
    expect:
      route: workflow-status（报告）+ 建议 workflow-archive preview
      behavior: "status 只建议 preview_required，不移动 topic"
    notes: "归档候选不携带移动授权"
  - id: no-action-01
    kind: boundary
    input: "扫一下 workspace，如果没问题就告诉我"
    expect:
      route: workflow-status
      behavior: "无稳定 next action 时输出 no_action，不制造后续 workflow"
    notes: "无 action 不为了治理制造动作"
