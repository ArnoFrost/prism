# prism.local.yaml — Prism 4 current configuration contract
# Human-readable contract. Runtime parsing is owned by bin/workspace_resolve.py.

version: "4.0-canary"
schema: named-workspaces

required:
  device_id:
    type: string
    description: "当前设备标识；bin/setenv --init 默认取 hostname -s"
  sdk_path:
    type: absolute_path
    description: "Prism SDK 仓库"
  default_workspace:
    type: workspace_id
    description: "必须指向 workspaces 中已存在的条目"
  workspaces:
    type: map
    value:
      workspace_root:
        type: absolute_path
        required: true
      workspace_subdir:
        type: relative_path
        required: true
      workspace_git:
        type: map
        required: false

optional:
  skills_path:
    type: absolute_path
  env_path:
    type: absolute_path
  obs_vault:
    type: absolute_path
  archived_skills:
    type: list
  projects:
    type: map
    value:
      path:
        type: absolute_path
        required: true
      workspace:
        type: workspace_id
        required: true

example:
  device_id: ARNOFROSTXU-MC1
  sdk_path: /Users/xuxin/prism
  default_workspace: work
  workspaces:
    work:
      workspace_root: /Users/xuxin/.local/share/prism
      workspace_subdir: Workspace
  projects:
    PRISM:
      path: /Users/xuxin/prism
      workspace: work

rules:
  - "此文件是本机状态，不入版本控制"
  - "只接受 named-workspaces；旧扁平格式在当前分支 fail closed"
  - "项目注册使用 prism host attach --code CODE"
  - "bin/setenv、bin/relink、Host 与 doctor 共用 bin/workspace_resolve.py 的解释"
  - "路径写绝对路径；~ 仅允许出现在展示样例，落盘时由 setenv 展开"

tool_integration:
  setenv_init: "生成 current named-workspaces 配置"
  setenv_validate: "委托 doctor config stage 校验"
  setenv_export: "导出默认 Workspace 与可选扩展环境变量"
  host_attach: "向 projects 写入 path + workspace 对象"
  relink: "按项目绑定刷新 workspace.{code}.local"
