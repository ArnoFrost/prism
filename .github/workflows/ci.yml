name: CI

# Prism SDK 持续集成闸门：
#   1. uv 已装（astral-sh/setup-uv）
#   2. bin/* 可执行 + bin/prism --version 启动正常（doctor --scope ci）
#   3. skills frontmatter 合规（doctor --scope ci 内含 skill 阶段）
#   4. pytest tests/ 全绿（4.0 主线 + setup smoke + release metadata）；
#      bin/ 的 bash 用例单独一步调用（pytest 不收集 .sh）
#   5. release gate：版本元数据一致；BREAKING 变更必须同步 CHANGELOG.md + docs/migration.md
#      （bin/release_gate.py；3.x 时代的 check_cli_contract_sync 已随 legacy 树剔除）
# 双 runner（macos-latest + ubuntu-latest）覆盖分发用户主流 OS。
# 不依赖 prism.local.yaml / vault / ~/.local/bin（doctor --scope ci 自包含）。
#
# 维护备忘（GitHub Actions / Node 24）：
#   - setup-uv: v7（Node 24 默认）
#   - upload-artifact: v6
#   - checkout: v5

on:
  workflow_dispatch:
  push:
    branches: [main, mini, prism-4, "release/**"]
  pull_request:
    branches: [main, mini, prism-4]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: doctor + pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # release_gate 需要 git diff base..head；默认 fetch-depth: 1（shallow clone）
          # 会让 push 事件的 `before` SHA 在本地不可达 → release_gate 报 `bad object`
          # 让 step 真红。本仓 172 commits / 8.5MB，fetch-depth: 0 无性能代价。
          fetch-depth: 0

      - name: Setup uv
        # setup-uv v7 — Node.js 24 默认（runner 已弃用 Node 20）
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # 本仓存在 uv.lock / pyproject.toml；当前仍显式置空，避免跨平台 cache
          # key 与本地-only 工作区状态耦合。依赖安装由 uv run / dependency-groups 负责。
          cache-dependency-glob: ""

      - name: Install Python via uv
        run: uv python install 3.11

      - name: Show toolchain
        run: |
          uv --version
          uv run python --version
          bin/prism --version || true

      - name: Doctor — scope ci (self-contained health gate)
        run: |
          bin/doctor --scope ci --json | tee doctor-ci.json
          bin/doctor --scope ci

      - name: pytest — SDK smoke + 4.0 tests
        run: |
          uv run --with pytest python -m pytest tests/ -q

      # pytest 只收集 test_*.py，这个 bash 用例守 bin/relink 的 Workspace
      # 回写路径（含二次写入幂等与重复 paths: 防护），必须显式调用。
      - name: relink writeback 健壮性
        shell: bash
        run: bash tests/test_relink_writeback.sh

      - name: Release gate — version metadata + breaking docs sync
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        # 显式 shell: bash 启用 pipefail（GHA 默认 `bash -e {0}` 不带 pipefail），
        # 否则 `release_gate.py … | tee` 中上游脚本非零退出会被 `tee` 吞成功，
        # 导致 breaking 提交可在无文档同步的情况下静默合入。
        shell: bash
        run: |
          uv run python bin/release_gate.py \
            --repo . \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA" \
            --expected-tag "$PR_RELEASE_TAG" \
            --json | tee release-gate.json

      - name: Validate skills
        run: |
          bin/validate-skills --json | tee validate-skills.json

      - name: Upload doctor / validate artifacts
        if: always()
        # upload-artifact v6 — Node.js 24 默认
        uses: actions/upload-artifact@v6
        with:
          name: prism-ci-${{ matrix.os }}
          path: |
            doctor-ci.json
            release-gate.json
            validate-skills.json
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: required
    if: ${{ always() }}
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI matrix leg
        env:
          MATRIX_RESULT: ${{ needs.lint-and-test.result }}
        run: test "$MATRIX_RESULT" = success
